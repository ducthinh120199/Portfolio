<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Seckill — flash-sale request flow</title>
  <desc id="d">Burst traffic hits a Spring Boot API, stock is reserved atomically in Redis, orders are buffered through Kafka, and a consumer persists them to MySQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8672b"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#c8672b" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
      .eyebrow { font-size: 15px; letter-spacing: 2px; fill: #c8672b; }
      .h { font-size: 34px; font-weight: 700; fill: #14161c; }
      .box-title { font-size: 22px; font-weight: 700; fill: #14161c; }
      .box-sub { font-size: 15px; fill: #5b6270; }
      .tag { font-size: 13px; fill: #c8672b; }
      .side { font-size: 14px; fill: #5b6270; }
    </style>
  </defs>

  <rect width="800" height="1000" fill="#fbeee1"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" class="mono eyebrow">SECKILL · REQUEST FLOW</text>
  <text x="80" y="122" class="sans h">Flash-sale, end to end</text>

  <!-- 1. Users -->
  <rect x="80" y="160" width="460" height="96" rx="16" fill="#ffffff" stroke="#e4e6eb" stroke-width="2"/>
  <text x="108" y="200" class="sans box-title">Users — burst traffic</text>
  <text x="108" y="230" class="sans box-sub">Thousands of buy requests in the same second</text>

  <line x1="310" y1="256" x2="310" y2="296" stroke="#c8672b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2. API -->
  <rect x="80" y="300" width="460" height="110" rx="16" fill="#ffffff" stroke="#e4e6eb" stroke-width="2"/>
  <text x="108" y="340" class="sans box-title">Spring Boot API</text>
  <text x="108" y="368" class="sans box-sub">Rate limiting · one-order-per-user check</text>
  <rect x="108" y="380" width="96" height="22" rx="11" fill="#fbeee1"/>
  <text x="156" y="396" class="mono tag" text-anchor="middle">ENTRY</text>

  <line x1="310" y1="410" x2="310" y2="452" stroke="#c8672b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3. Redis (hot path) -->
  <rect x="80" y="456" width="460" height="124" rx="16" fill="#ffffff" stroke="#c8672b" stroke-width="3"/>
  <text x="108" y="498" class="sans box-title">Redis — stock gate</text>
  <text x="108" y="526" class="sans box-sub">Atomic decrement (Lua script) — no oversell,</text>
  <text x="108" y="548" class="sans box-sub">no DB hit on the hot path</text>
  <rect x="412" y="478" width="104" height="24" rx="12" fill="#fbeee1"/>
  <text x="464" y="495" class="mono tag" text-anchor="middle">HOT PATH</text>

  <!-- side branch: sold out -->
  <line x1="540" y1="518" x2="590" y2="518" stroke="#5b6270" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <rect x="596" y="476" width="164" height="84" rx="14" fill="#f6f7f9" stroke="#e4e6eb" stroke-width="2"/>
  <text x="678" y="510" class="sans side" text-anchor="middle" font-weight="700" fill="#14161c">Stock = 0</text>
  <text x="678" y="536" class="sans side" text-anchor="middle">reject instantly</text>

  <line x1="310" y1="580" x2="310" y2="622" stroke="#c8672b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4. Kafka -->
  <rect x="80" y="626" width="460" height="100" rx="16" fill="#ffffff" stroke="#e4e6eb" stroke-width="2"/>
  <text x="108" y="666" class="sans box-title">Kafka — order queue</text>
  <text x="108" y="696" class="sans box-sub">Absorbs the spike, decouples writes</text>
  <!-- queue glyph -->
  <g fill="#c8672b">
    <rect x="452" y="664" width="16" height="28" rx="3" fill-opacity="0.35"/>
    <rect x="474" y="664" width="16" height="28" rx="3" fill-opacity="0.6"/>
    <rect x="496" y="664" width="16" height="28" rx="3"/>
  </g>

  <line x1="310" y1="726" x2="310" y2="768" stroke="#c8672b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 5. Consumer + MySQL -->
  <rect x="80" y="772" width="460" height="110" rx="16" fill="#ffffff" stroke="#e4e6eb" stroke-width="2"/>
  <text x="108" y="812" class="sans box-title">Order consumer → MySQL</text>
  <text x="108" y="840" class="sans box-sub">Idempotent insert · final stock check</text>
  <text x="108" y="864" class="sans box-sub">in a DB transaction</text>
  <!-- db glyph -->
  <g fill="none" stroke="#c8672b" stroke-width="2.5">
    <ellipse cx="490" cy="812" rx="26" ry="9"/>
    <path d="M464 812 V852 A26 9 0 0 0 516 852 V812"/>
    <path d="M464 832 A26 9 0 0 0 516 832"/>
  </g>

  <text x="80" y="944" class="mono side">Java · Spring Boot · Redis · Kafka · MySQL</text>
</svg>
